<!DOCTYPE html>
<html lang="en" class="h-full scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIDC - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="min-h-screen flex flex-col p-3 md:p-6 space-y-4">

    <!-- 헤더 (각 HTML 파일로 직접 이동하는 <a> 태그 적용) -->
    <header class="w-full bg-white border border-slate-200 rounded-2xl p-[20px] flex flex-col md:flex-row justify-between items-center gap-3 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white text-lg font-black"><i class="fa-solid fa-graduation-cap"></i></div>
            <div>
                <h1 class="text-[14px] font-black tracking-tight text-slate-900 uppercase">CIDC LOGO</h1>
                <p class="text-[10px] text-slate-500 font-semibold">Executive Performance & Analytics</p>
            </div>
        </div>
        <nav class="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
            <a href="dashboard.html" class="nav-btn active flex items-center gap-2"><i class="fa-solid fa-chart-pie text-[10px]"></i> Dashboard</a>
            <a href="data-management.html" class="nav-btn flex items-center gap-2"><i class="fa-solid fa-table-list text-[10px]"></i> Data Management</a>
            <a href="career-path.html" class="nav-btn flex items-center gap-2"><i class="fa-solid fa-user-graduate text-[10px]"></i> Student Career Path</a>
        </nav>
    </header>

    <main class="flex-grow w-full space-y-4">
        <!-- TOP 4 KPI CARDS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="exec-card flex items-center justify-between border-l-4 border-l-blue-600">
                <div>
                    <span class="text-[10px] font-black tracking-wider text-slate-500 uppercase block mb-1">TOTAL GRADUATES TRACKED</span>
                    <span id="stat-total-graduates" class="text-2xl font-black text-slate-900">1,248</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg"><i class="fa-solid fa-graduation-cap"></i></div>
            </div>
            <div class="exec-card flex items-center justify-between border-l-4 border-l-indigo-600">
                <div>
                    <span class="text-[10px] font-black tracking-wider text-slate-500 uppercase block mb-1">OVERALL PLACEMENT RATE</span>
                    <span id="stat-placement-rate" class="text-2xl font-black text-slate-900">88.5%</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg"><i class="fa-solid fa-briefcase"></i></div>
            </div>
            <div class="exec-card flex items-center justify-between border-l-4 border-l-teal-600">
                <div>
                    <span class="text-[10px] font-black tracking-wider text-slate-500 uppercase block mb-1">STEM / OPT UTILIZATION</span>
                    <span id="stat-opt-rate" class="text-2xl font-black text-slate-900">65.0%</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center text-lg"><i class="fa-solid fa-passport"></i></div>
            </div>
            <div class="exec-card flex items-center justify-between border-l-4 border-l-amber-500">
                <div>
                    <span class="text-[10px] font-black tracking-wider text-slate-500 uppercase block mb-1">STUDENT SATISFACTION</span>
                    <span class="text-2xl font-black text-slate-900">98.4%</span>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-lg"><i class="fa-solid fa-award"></i></div>
            </div>
        </div>

        <!-- CHARTS ROW -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-stretch">
            <div class="exec-card flex flex-col justify-between h-full bg-white">
                <h2 class="text-[14px] font-black text-slate-900 mt-2 leading-snug">Employment & Internship Rate</h2>
                <div class="compact-chart-container relative w-full bg-slate-50 rounded-xl border border-slate-200 p-2 my-1 shrink-0">
                    <canvas id="chart-employment-cohort"></canvas>
                </div>
                <div class="pt-3 mt-auto"><div class="grid grid-cols-4 sm:grid-cols-8 gap-2.5" id="company-logos-grid"></div></div>
            </div>

            <div class="exec-card flex flex-col justify-between h-full bg-white">
                <h2 class="text-[14px] font-black text-slate-900 mt-2 leading-snug">OPT-USED Employment Rate</h2>
                <div class="flex items-center justify-around relative w-full h-[180px] bg-slate-50 rounded-xl border border-slate-200 p-2 my-2 shrink-0">
                    <div class="w-32 h-32 relative flex items-center justify-center"><canvas id="chart-opt-donut"></canvas></div>
                    <div class="w-32 h-32 relative flex items-center justify-center">
                        <canvas id="chart-emp-donut"></canvas>
                        <span id="label-emp-yes" class="absolute text-[14px] font-black text-indigo-700">88%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM EVENT SHOWCASE -->
        <div class="exec-card flex flex-col justify-between space-y-3.5">
            <h2 class="text-[14px] font-black text-slate-900">Event Showcase</h2>
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch">
                <div class="md:col-span-4 exec-sub-card p-2 space-y-1.5 overflow-y-auto max-h-[250px]" id="event-items-list"></div>
                <div class="md:col-span-8 exec-sub-card p-3 flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-2">
                        <h3 id="event-photo-title" class="text-[12px] font-black text-slate-900"></h3>
                        <div class="flex gap-1.5">
                            <button onclick="prevEvent()" class="w-6 h-6 rounded bg-slate-200"><i class="fa-solid fa-chevron-left"></i></button>
                            <button onclick="nextEvent()" class="w-6 h-6 rounded bg-slate-200"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                    </div>
                    <img id="event-photo-img" src="" class="rounded-xl overflow-hidden h-44 w-full object-cover">
                    <p id="event-desc-text" class="text-[10px] text-slate-700 font-semibold italic mt-2"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- 스크립트 연결 (순서 엄수) -->
    <script src="js/data/dbState.js"></script>
    <script src="js/dashboard/eventCard.js"></script>
    <script src="js/dashboard/dashboard.js"></script>
</body>
</html>
